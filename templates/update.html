   {% extends 'base.html' %}
   {% block title %} Home {% endblock title %}
   {% block body %}

    <div class="container my-4">
        <h2>Update Todo</h2>

        <form action="/update/{{todo.sno}}" method="POST">
            <div class="mb-3">
                <label for="title" class="form-label">Todo Title</label>
                <input type="text" class="form-control" name="title" id="title"
                value = "{{todo.title}}" placeholder="Enter todo title" required>
            </div>

            <div class="mb-3">
                <label for="desc" class="form-label">Todo Description</label>
                <input type="text" class="form-control" value = "{{todo.desc}}" name="desc" id="desc"
                    placeholder="Enter todo description" required>
            </div>

            <button type="submit" class="btn btn-dark">Update</button>
        </form>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

{% endblock body %}
